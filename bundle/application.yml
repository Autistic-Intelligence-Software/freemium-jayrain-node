# FreeMium JayRain audio node — tuned Lavalink configuration
# Generated by the freemium-jayrain-node bundle builder.
# You only ever need to change ONE thing: the password below
# (the start script asks for it on first run and fills it in).

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "__NODE_PASSWORD__"
    sources:
      youtube: false # deprecated built-in source off — the youtube plugin handles it
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 7 # tuned: 10 is max CPU for no audible gain; 7 is the sweet spot
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 3 # up to 300 tracks per playlist load
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: true
      qobuz: false
      ytdlp: true
      jiosaavn: false
    lyrics-sources:
      spotify: true
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      lrcLib: true

logging:
  level:
    lavalink: INFO
